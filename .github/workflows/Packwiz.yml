name: Packwiz
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_packwiz_packs:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo GOBIN=/usr/local/bin go install github.com/packwiz/packwiz@latest
  
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: build main pack
        run: |
          bash -c "rm -rf $(cat .packwizignore | xargs)"
          echo "hash-format = \"sha256\"" > index.toml
          /usr/local/bin/packwiz refresh --build
          
      - uses: actions/checkout@v6
        with:
          ref: dev
          path: dev
      - name: build dev pack
        working-directory: dev
        run: |
          bash -c "rm -rf $(cat .packwizignore | xargs)"
          echo "hash-format = \"sha256\"" > index.toml
          /usr/local/bin/packwiz refresh --build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          
  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build_packwiz_packs
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment